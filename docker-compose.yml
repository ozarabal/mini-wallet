services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers reach it at kafka:9092; from your own machine use
  # localhost:29092. New topics get 3 partitions so events with different keys are spread out.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # Dev-only default so `docker compose up` just works. Set JWT_SECRET to your own value for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      # Per-user limit on POST /transfers. Defaults match application.yml; raise them for load tests,
      # otherwise the limiter (correctly) throttles the test.
      WALLET_RATELIMIT_TRANSFERS_BURST: ${RATE_LIMIT_BURST:-20}
      WALLET_RATELIMIT_TRANSFERS_REFILLPERSECOND: ${RATE_LIMIT_REFILL:-10}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Switches for the background jobs; turn them off to measure what each one costs (see load-test/README.md).
      WALLET_OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      WALLET_NOTIFICATION_CONSUMER_ENABLED: ${NOTIFICATION_CONSUMER_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Load-test runner. Only started on request: docker compose --profile loadtest run --rm k6 run /scripts/transfer.js
  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./load-test:/scripts
    depends_on:
      - app

volumes:
  pgdata:
