services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # Dev-only default so `docker compose up` just works. Set JWT_SECRET to your own value for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Load-test runner. Only started on request: docker compose --profile loadtest run --rm k6 run /scripts/transfer.js
  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./load-test:/scripts
    depends_on:
      - app

volumes:
  pgdata:
