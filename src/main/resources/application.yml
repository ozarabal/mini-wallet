spring:
  application:
    name: mini-wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      # How many requests can talk to the database at the same time. 10 is HikariCP's own default,
      # written down here so it is visible and can be changed for experiments (see the load-test notes).
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true

wallet:
  jwt:
    # HMAC key for signing access tokens. Required (no default on purpose: the app refuses to start without it)
    # and must be at least 32 bytes. Set the JWT_SECRET environment variable.
    secret: ${JWT_SECRET}
    issuer: mini-wallet
    ttl: 15m   # how long an access token is valid; there are no refresh tokens in this version

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
