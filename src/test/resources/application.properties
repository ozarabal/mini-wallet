# Test defaults (added on top of src/main/resources/application.yml).
# Tests run the outbox publisher by hand, one step at a time. A background job would mark events published behind
# their back and make assertions about "not yet published" a race. OutboxSchedulerIT switches it back on for itself.
wallet.outbox.publisher.enabled=false
# Same for the Kafka consumer: most tests have no broker. NotificationConsumerIT switches it on for itself.
wallet.notification.consumer.enabled=false
